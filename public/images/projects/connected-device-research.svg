<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Connected device research system diagram</title>
  <desc id="description">Sensors send readings to an edge controller, which shares data through a secure network and produces useful monitoring and control actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061f3d"/>
      <stop offset="1" stop-color="#10477d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#65c9f3" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1 1l10 6-10 6z" fill="#65c9f3"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="url(#background)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <circle cx="1380" cy="120" r="280" fill="#1489c9" opacity=".13"/>
  <circle cx="180" cy="1080" r="330" fill="#65c9f3" opacity=".08"/>

  <text x="100" y="110" fill="#80d7fa" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">CONNECTED DEVICE RESEARCH</text>
  <text x="100" y="174" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700">From real-world signals to useful action</text>

  <path d="M430 590H570M950 590h120" fill="none" stroke="#65c9f3" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1250 450V330H760V410" fill="none" stroke="#65c9f3" stroke-opacity=".55" stroke-width="5" stroke-dasharray="12 14" marker-end="url(#arrow)"/>

  <g transform="translate(90 350)">
    <rect width="340" height="480" rx="32" fill="url(#panel)" stroke="#65c9f3" stroke-opacity=".35" stroke-width="3"/>
    <text x="38" y="62" fill="#80d7fa" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">01  SENSE</text>
    <text x="38" y="108" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Environment</text>
    <g transform="translate(38 150)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect width="264" height="72" rx="18" fill="#061f3d" fill-opacity=".45" stroke="#ffffff" stroke-opacity=".25"/>
      <path d="M38 23v25a16 16 0 1032 0V23a16 16 0 10-32 0z" stroke="#65c9f3"/><path d="M54 25v31" stroke="#65c9f3"/>
      <text x="96" y="46" fill="#ffffff" stroke="none" font-family="Arial, sans-serif" font-size="24">Temperature</text>
    </g>
    <g transform="translate(38 242)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
      <rect width="264" height="72" rx="18" fill="#061f3d" fill-opacity=".45" stroke="#ffffff" stroke-opacity=".25"/>
      <circle cx="53" cy="36" r="12" stroke="#65c9f3"/><path d="M30 36h-8m62 0h-8M37 20l-7-7m46 7l7-7M37 52l-7 7m46-7l7 7" stroke="#65c9f3"/>
      <text x="96" y="46" fill="#ffffff" stroke="none" font-family="Arial, sans-serif" font-size="24">Motion</text>
    </g>
    <g transform="translate(38 334)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
      <rect width="264" height="72" rx="18" fill="#061f3d" fill-opacity=".45" stroke="#ffffff" stroke-opacity=".25"/>
      <path d="M54 12L35 40h17l-7 20 27-32H55z" stroke="#65c9f3"/>
      <text x="96" y="46" fill="#ffffff" stroke="none" font-family="Arial, sans-serif" font-size="24">Power use</text>
    </g>
  </g>

  <g transform="translate(570 350)">
    <rect width="380" height="480" rx="32" fill="url(#panel)" stroke="#65c9f3" stroke-opacity=".35" stroke-width="3"/>
    <text x="38" y="62" fill="#80d7fa" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">02  PROCESS</text>
    <text x="38" y="108" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Edge device</text>
    <g transform="translate(82 150)">
      <rect width="216" height="216" rx="26" fill="#061f3d" stroke="#65c9f3" stroke-width="6"/>
      <rect x="45" y="45" width="126" height="126" rx="16" fill="#1489c9" stroke="#80d7fa" stroke-width="4"/>
      <path d="M72 108h72M108 72v72" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <g stroke="#65c9f3" stroke-width="6"><path d="M30 24V0m52 24V0m52 24V0m52 24V0M30 216v24m52-24v24m52-24v24m52-24v24M24 30H0m24 52H0m24 52H0m24 52H0m192-156h24m-24 52h24m-24 52h24m-24 52h24"/></g>
    </g>
    <text x="190" y="424" text-anchor="middle" fill="#d8e6ef" font-family="Arial, sans-serif" font-size="22">Filter • analyse • respond</text>
  </g>

  <g transform="translate(1070 350)">
    <rect width="440" height="480" rx="32" fill="url(#panel)" stroke="#65c9f3" stroke-opacity=".35" stroke-width="3"/>
    <text x="38" y="62" fill="#80d7fa" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">03  CONNECT</text>
    <text x="38" y="108" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Useful action</text>
    <g transform="translate(58 158)">
      <rect width="324" height="214" rx="24" fill="#eef6fb"/>
      <rect x="28" y="28" width="268" height="34" rx="10" fill="#ccdde9"/>
      <circle cx="48" cy="45" r="6" fill="#1489c9"/>
      <path d="M38 158l54-48 48 24 58-64 76 46" fill="none" stroke="#0875b0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="92" cy="110" r="8" fill="#061f3d"/><circle cx="140" cy="134" r="8" fill="#061f3d"/><circle cx="198" cy="70" r="8" fill="#061f3d"/><circle cx="274" cy="116" r="8" fill="#061f3d"/>
      <path d="M38 180h236" stroke="#92afc4" stroke-width="3"/>
    </g>
    <g transform="translate(70 402)" fill="#d8e6ef" font-family="Arial, sans-serif" font-size="21">
      <circle cx="8" cy="-7" r="8" fill="#65c9f3"/><text x="28">Monitor</text>
      <circle cx="138" cy="-7" r="8" fill="#65c9f3"/><text x="158">Alert</text>
      <circle cx="248" cy="-7" r="8" fill="#65c9f3"/><text x="268">Control</text>
    </g>
  </g>

  <g transform="translate(636 904)">
    <circle cx="28" cy="28" r="13" fill="#65c9f3" filter="url(#glow)"/>
    <path d="M62 28h96m30 0h96" stroke="#65c9f3" stroke-width="4" stroke-dasharray="8 10"/>
    <text x="310" y="37" fill="#c4d9e8" font-family="Arial, sans-serif" font-size="24">Secure wireless data flow</text>
  </g>
</svg>
